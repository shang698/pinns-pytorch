[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinns-pytorch-course"
version = "0.1.0"
description = "Continuous- and discrete-time PINNs in PyTorch"
authors = [{name = "Shang Gao"}]
requires-python = ">=3.11,<3.13"
dependencies = ["torch==2.6.0", "numpy==1.26.4", "scipy==1.16.2", "matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
